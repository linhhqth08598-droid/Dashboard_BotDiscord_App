<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Discord Bot Dashboard</title>
    <style>
      :root { color-scheme: dark light; }
      * { box-sizing: border-box; }
      body {
        margin: 0; height: 100vh; display: grid; place-items: center;
        background: #14161b; color: #f3f4f8;
        font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      @media (prefers-color-scheme: light) { body { background: #f1f3f8; color: #10131a; } .sub { color: #4d566a !important; } }
      .box { text-align: center; max-width: 420px; padding: 24px; }
      .logo {
        display: block; width: 84px; height: 84px; margin: 0 auto 20px; border-radius: 22px;
        box-shadow: 0 10px 30px -10px rgb(88 101 242 / .7);
      }
      h1 { margin: 0 0 6px; font-size: 22px; }
      .sub { margin: 0; color: #9aa1b2; min-height: 3em; }
      .spinner {
        width: 28px; height: 28px; margin: 22px auto 0; border-radius: 50%;
        border: 3px solid rgb(128 128 128 / .3); border-top-color: #5865f2;
        animation: spin .8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      button {
        margin-top: 20px; padding: 10px 20px; border: 0; border-radius: 10px;
        background: #5865f2; color: #fff; font: inherit; font-weight: 600; cursor: pointer;
      }
      button:hover { background: #4752c4; }
      .hidden { display: none; }
    </style>

      <h1 id="title">Bot Dashboard</h1>
      <p class="sub" id="msg">Đang kết nối tới dashboard…</p>
      <div class="spinner" id="spin"></div>
      <button id="retry" class="hidden">Thử lại</button>
    </div>

    <script>
      // Địa chỉ dashboard web. Đổi ở đây nếu bạn đổi tên miền.
      const DASHBOARD_URL = 'https://dashboard-botdiscord.onrender.com';

      const OFFLINE_TITLE = 'Không có kết nối mạng';
      const OFFLINE_MSG = 'Dashboard cần internet để lấy dữ liệu Discord. Hãy kiểm tra mạng rồi thử lại.';
      const title = document.getElementById('title');
      const msg = document.getElementById('msg');
      const spin = document.getElementById('spin');
      const retry = document.getElementById('retry');
      let attempt = 0;
      let stopped = false;

      // Gắn phiên bản app + nền tảng vào địa chỉ để chân trang của dashboard hiện "Ứng dụng vX.Y.Z".
      // (Lấy từ Tauri; nếu không lấy được thì bỏ qua, dashboard vẫn mở bình thường.)
      async function dashboardUrl() {
        try {
          const inv = window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke;
          if (!inv) return DASHBOARD_URL;
          const version = await Promise.race([
            inv('plugin:app|version'),
            new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 2000)),
          ]);
          const platform = /android/i.test(navigator.userAgent) ? 'android' : 'desktop';
          return DASHBOARD_URL + '/?appv=' + encodeURIComponent(version) + '&appp=' + platform;
        } catch {
          return DASHBOARD_URL;
        }
      }

      async function ping() {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 10000);
        try {
          // no-cors: chỉ cần biết máy chủ có trả lời hay không
          await fetch(DASHBOARD_URL + '/?_=' + Date.now(), { mode: 'no-cors', cache: 'no-store', signal: ctrl.signal });
          return true;
        } catch {
          return false;
        } finally {
          clearTimeout(timer);
        }
      }

      async function connect() {
        stopped = false;
        attempt = 0;
        retry.classList.add('hidden');
        spin.classList.remove('hidden');
        title.textContent = 'Bot Dashboard';
        msg.textContent = 'Đang kết nối tới dashboard…';

        while (!stopped) {
          // Máy báo không có mạng: hiện ngay màn hình "mất mạng" (giống trang offline của web), khỏi chờ ~1 phút.
          if (navigator.onLine === false) {
            stopped = true;
            spin.classList.add('hidden');
            title.textContent = OFFLINE_TITLE;
            msg.textContent = OFFLINE_MSG;
            retry.classList.remove('hidden');
            return;
          }
          attempt++;
          if (await ping()) {
            msg.textContent = 'Đã kết nối, đang mở…';
            location.replace(await dashboardUrl());
            return;
          }
          if (attempt >= 3) {
            msg.textContent = 'Máy chủ Render có thể đang khởi động lại (mất tới ~1 phút). Vui lòng đợi…';
          }
          if (attempt >= 20) {
            stopped = true;
            spin.classList.add('hidden');
            title.textContent = OFFLINE_TITLE;
            msg.textContent = OFFLINE_MSG;
            retry.classList.remove('hidden');
            return;
          }
          await new Promise((r) => setTimeout(r, 3000));
        }
      }

      retry.addEventListener('click', connect);
      window.addEventListener('online', () => { if (stopped) connect(); }); // có mạng lại -> tự kết nối
      connect();
    </script>
  </body>
</html>
