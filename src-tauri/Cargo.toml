[package]
name = "app"
version = "0.1.0"
description = "Ứng dụng desktop cho Discord Bot Dashboard"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
serde_json = "1"

[features]
# `tauri dev` chạy cargo với --no-default-features; `tauri build` tự bật feature này.
custom-protocol = ["tauri/custom-protocol"]
