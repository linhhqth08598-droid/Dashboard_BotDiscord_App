[package]
name = "discord-bot-dashboard"
version = "0.1.2"
description = "Ứng dụng Discord Bot Dashboard (Windows và Android)"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
serde_json = "1"

# Updater và hộp thoại chỉ dùng trên máy tính, không có trên Android/iOS.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"

[features]
# `tauri dev` chạy cargo với --no-default-features; `tauri build` tự bật feature này.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
