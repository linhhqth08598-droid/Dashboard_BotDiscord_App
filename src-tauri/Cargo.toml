[package]
name = "discord-bot-dashboard"
version = "0.2.2"
description = "Ứng dụng Discord Bot Dashboard (Windows và Android)"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
serde_json = "1"

# Điều khiển media của hệ điều hành (Windows SMTC / thông báo nhạc Android) - plugin nội bộ.
tauri-plugin-dash-media = { path = "plugins/dash-media" }

# Hộp thoại và mở trang tải dùng cho cả máy tính lẫn Android.
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

# Updater chỉ dùng trên máy tính, không có trên Android/iOS.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
# Chạy lần 2 thì chỉ đưa cửa sổ đang chạy lên, không mở thêm bản thứ hai (app ở khay hệ thống).
tauri-plugin-single-instance = "2"

# Windows: đặt tên ứng dụng (AppUserModelID) để ô nhạc Windows không ghi "Ứng dụng không xác định".
[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows = { version = "0.62", features = ["Win32_UI_Shell"] }

# Android/iOS: tự hỏi GitHub xem có bản mới không (dùng rustls để khỏi phụ thuộc OpenSSL).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }

[features]
# `tauri dev` chạy cargo với --no-default-features; `tauri build` tự bật feature này.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
