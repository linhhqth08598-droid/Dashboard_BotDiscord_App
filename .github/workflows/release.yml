name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ---------- Windows: .exe + .msi + latest.json (tự cập nhật) ----------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npx tauri
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: "Xem thay đổi trong lịch sử commit."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

  # ---------- Android: .apk ký bằng keystore riêng, đính vào cùng Release ----------
  # Chạy SAU job Windows (needs) để Release đã tồn tại, tránh hai job cùng tạo Release.
  # continue-on-error: nếu Android lỗi thì bản Windows vẫn được phát hành bình thường.
  android:
    needs: windows
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Chỉ build arm64 (gần như mọi điện thoại hiện nay) để APK nhẹ.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cấu hình Android SDK/NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Khởi tạo project Android
        run: npx tauri android init

      # onrender.com đang bị Google Safe Browsing gắn cờ nhầm -> WebView Android hiện trang đỏ.
      # Tắt Safe Browsing cho WebView của riêng app này (app chỉ mở đúng dashboard của bạn).
      - name: Tắt Safe Browsing trong WebView
        run: |
          M=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          sed -i '0,/<application[^>]*>/s##&\n        <meta-data android:name="android.webkit.WebView.EnableSafeBrowsing" android:value="false" />#' "$M"
          grep -n "EnableSafeBrowsing" "$M"

      - name: Build APK (chưa ký)
        run: npx tauri android build --apk --target aarch64

      - name: Căn chỉnh và ký APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          UNSIGNED=$(find src-tauri/gen/android -name "*-unsigned.apk" | head -n 1)
          if [ -z "$UNSIGNED" ]; then echo "Không tìm thấy APK vừa build"; find src-tauri/gen/android -name "*.apk"; exit 1; fi
          echo "APK: $UNSIGNED"

          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"

          VERSION="${GITHUB_REF_NAME#v}"
          OUT="Discord.Bot.Dashboard_${VERSION}_android.apk"

          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "$OUT"
          echo "APK_FILE=$OUT" >> "$GITHUB_ENV"

      - name: Đính APK vào Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ env.APK_FILE }}